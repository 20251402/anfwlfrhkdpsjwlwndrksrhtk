<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style>
<title>물질과 에너지 OMR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  color-scheme: light;
  --bg:#e9ecf1; --surface:#ffffff; --surface-2:#f4f6f9;
  --ink:#161a21; --muted:#5d6675; --faint:#8a93a2;
  --line:#d3d9e2; --line-soft:#e4e8ee;
  --accent:#2a55c4; --accent-soft:#e6ecfb;
  --ok:#0f7554; --ok-soft:#e2f2ec;
  --bad:#b32d22; --bad-soft:#fbe9e7;
  --paper:#ffffff;
  --shadow:0 1px 2px rgba(20,28,45,.06), 0 8px 24px -14px rgba(20,28,45,.28);
  --r:12px;
  --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#101319; --surface:#181c24; --surface-2:#1f242e;
    --ink:#e6e9ef; --muted:#9aa4b4; --faint:#6d7787;
    --line:#2b313d; --line-soft:#232935;
    --accent:#7d9ffb; --accent-soft:#1b2540;
    --ok:#4ed3a0; --ok-soft:#14302a;
    --bad:#ff8d80; --bad-soft:#341f1e;
    --paper:#ffffff;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -14px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#101319; --surface:#181c24; --surface-2:#1f242e;
  --ink:#e6e9ef; --muted:#9aa4b4; --faint:#6d7787;
  --line:#2b313d; --line-soft:#232935;
  --accent:#7d9ffb; --accent-soft:#1b2540;
  --ok:#4ed3a0; --ok-soft:#14302a;
  --bad:#ff8d80; --bad-soft:#341f1e;
  --paper:#ffffff;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -14px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
  font-size:15px;line-height:1.65;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
input,select{font:inherit;color:inherit}
h1,h2,h3{text-wrap:balance;margin:0}
.wrap{max-width:940px;margin:0 auto;padding-inline:16px;padding-block:0}

.hero{padding-block:44px 26px}
.eyebrow{font-family:var(--mono);font-size:11.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--faint);margin:0 0 10px}
.hero h1{font-size:clamp(27px,6vw,38px);font-weight:700;letter-spacing:-.02em;line-height:1.2}
.hero p{color:var(--muted);margin:10px 0 0;max-width:46ch}
.sec-label{font-family:var(--mono);font-size:11.5px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--faint);margin:30px 0 11px}
.sets{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:10px}
.set{display:flex;flex-direction:column;gap:7px;align-items:flex-start;text-align:left;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:14px 15px;transition:border-color .13s,transform .13s,box-shadow .13s}
.set:hover{border-color:var(--accent);transform:translateY(-1px);box-shadow:var(--shadow)}
.set[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1.5px var(--accent) inset;
  background:var(--accent-soft)}
.set b{font-size:17px;font-weight:600;letter-spacing:-.01em}
.set .meta{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.bar{height:3px;width:100%;background:var(--line-soft);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.opts{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.opt{display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:13px 15px;border-bottom:1px solid var(--line-soft)}
.opt:last-child{border-bottom:0}
.opt .t{font-weight:500}
.opt .d{display:block;font-size:12.5px;color:var(--muted);font-weight:400;line-height:1.45}
.sw{position:relative;flex:0 0 auto;width:44px;height:25px;border-radius:99px;
  background:var(--line);border:0;padding:0;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:19px;height:19px;border-radius:50%;
  background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.28);transition:transform .15s}
.sw[aria-checked="true"]{background:var(--accent)}
.sw[aria-checked="true"]::after{transform:translateX(19px)}
.go{margin:20px 0 48px;width:100%;padding:15px;border:0;border-radius:var(--r);
  background:var(--accent);color:#fff;font-size:16px;font-weight:600;letter-spacing:-.01em;
  box-shadow:var(--shadow)}
.go:disabled{opacity:.42;cursor:not-allowed;box-shadow:none}

.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;
  background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line)}
.topin{max-width:940px;margin:0 auto;padding:9px 16px;display:flex;align-items:center;gap:11px}
.ghost{background:none;border:1px solid var(--line);border-radius:8px;padding:6px 11px;
  font-size:13px;font-weight:500;color:var(--muted)}
.ghost:hover{border-color:var(--accent);color:var(--accent)}
.qid{font-family:var(--mono);font-size:13.5px;font-weight:600;letter-spacing:.02em;white-space:nowrap}
.qid span{color:var(--faint);font-weight:500}
.prog{flex:1;min-width:40px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow);overflow:hidden;margin-top:14px}
/* ---- 문제 본문 (텍스트 조판) ---- */
/* 문제지는 늘 흰 종이에 검은 글씨 — 기기가 다크 모드여도 글자가 흐려지지 않게
   색을 이 안에서 다시 정한다. '문제 반전'을 켜면 반대로 뒤집는다. */
.paper{background:var(--paper);padding:16px 15px 18px;overflow-x:auto;
  font-size:15.5px;line-height:1.75;word-break:keep-all;overflow-wrap:anywhere;
  --ink:#161a21; --muted:#5d6675; --faint:#8a93a2;
  --line:#d3d9e2; --line-soft:#e4e8ee; --surface-2:#f4f6f9;
  color:var(--ink)}
:root[data-invert="1"] .paper{--ink:#e6e9ef; --muted:#9aa4b4; --faint:#6d7787;
  --line:#2b313d; --line-soft:#232935; --surface-2:#1f242e}
.qp{margin:0 0 9px}
.qp:last-child{margin-bottom:0}
.qc{text-align:center;margin:12px 0}
.qpt{margin:6px 0 9px;text-align:right;font-size:13.5px;color:var(--muted)}
.paper i{font-family:"Times New Roman",Times,Georgia,serif;font-style:italic;font-size:1.04em}
.paper sub{font-size:.68em;vertical-align:-.28em;line-height:0}
.paper sup{font-size:.68em;vertical-align:.5em;line-height:0}
.fr{display:inline-flex;flex-direction:column;vertical-align:-.52em;text-align:center;
  margin:0 .16em;font-size:.94em}
.fn{display:block;padding:0 .3em .05em;border-bottom:1.3px solid currentColor;line-height:1.25}
.fd{display:block;padding:.05em .3em 0;line-height:1.25}
.spr{margin:12px auto;max-width:100%;-webkit-user-select:none;user-select:none;
  -webkit-touch-callout:none}
.spr i{display:block;background-repeat:no-repeat}
:root[data-invert="1"] .spr i{filter:invert(1) hue-rotate(180deg)}
.qimg{display:block;margin:12px auto;max-width:100%;height:auto;
  -webkit-user-drag:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
:root[data-invert="1"] .qimg{filter:invert(1) hue-rotate(180deg)}
.qbox{border:1px solid var(--ink);border-radius:2px;padding:10px 12px;margin:12px 0}
.qbogi{border:1px solid var(--ink);border-radius:2px;padding:10px 12px 11px;margin:12px 0;position:relative}
.bogihd{text-align:center;font-weight:600;letter-spacing:.35em;font-size:13px;
  margin:-2px 0 7px;color:var(--ink)}
.qtab{border-collapse:collapse;margin:12px auto;font-size:14.5px;max-width:100%}
.qtab td{border:1px solid var(--ink);padding:5px 10px;text-align:center;vertical-align:middle}
.qtab.nb td{border:0;padding:4px 14px}
.qtab.nb tr:first-child td{border-bottom:1px solid var(--line);font-weight:600}
.qmc{margin:12px 0 0;padding:0;list-style:none}
.qmc li{display:flex;gap:10px;align-items:center;padding:4px 0 4px 6px;min-height:28px}
.qmc .mk{color:var(--muted);flex:0 0 auto}
.qmcraw{margin:10px 0 0;padding-left:14px}
.qmct{border-collapse:separate;border-spacing:14px 6px;margin:10px auto 0}
.qmct td{text-align:center;vertical-align:middle}
.qmct td.mk{color:var(--muted);text-align:right;padding-right:2px}
.qmct th{font-weight:600;color:var(--muted);font-size:13.5px;padding-bottom:2px}
.solimg{display:block;width:100%;height:auto;-webkit-user-drag:none;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
:root[data-invert="1"] .solimg{filter:invert(1) hue-rotate(180deg)}
.sheet{background-repeat:no-repeat;margin:0 auto}
:root[data-invert="1"] .paper{background:#0d0f13}
:root[data-invert="1"] .sheet{filter:invert(1) hue-rotate(180deg)}
.nofig{padding:26px 16px;text-align:center;color:var(--faint);font-size:13.5px}
.ask{padding:15px 16px;border-top:1px solid var(--line-soft);background:var(--surface-2)}
.ask .lead{font-weight:600;letter-spacing:-.01em}
.ask .sub{font-size:12.5px;color:var(--muted);margin-top:3px}
.omr{display:flex;flex-wrap:wrap;gap:9px;padding:15px 16px}
.bub{flex:1 1 0;min-width:58px;height:56px;display:flex;align-items:center;justify-content:center;
  border:1.5px solid var(--line);border-radius:10px;background:var(--surface);
  font-size:21px;font-weight:600;transition:.12s}
.bub.kx{font-size:17px;letter-spacing:.02em}
.bub:hover:not(:disabled){border-color:var(--accent)}
.bub[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.bub:disabled{cursor:default;opacity:.85}
.bub.mark-o{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.bub.mark-x{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}

.fields{display:flex;flex-direction:column;gap:11px;padding:15px 16px}
.field{display:flex;align-items:center;gap:11px;flex-wrap:wrap}
.fname{font-family:var(--mono);font-size:14.5px;font-weight:600;min-width:112px;flex:0 0 auto}
.fname em{font-style:normal;color:var(--faint);font-weight:500;font-size:12.5px;margin-left:5px}
.field input{flex:1 1 130px;min-width:0;padding:11px 13px;border-radius:9px;
  border:1.5px solid var(--line);background:var(--surface);font-family:var(--mono);font-size:15.5px}
.field input:focus{outline:none;border-color:var(--accent)}
.field input:disabled{opacity:.9}
.field.mark-o input{border-color:var(--ok);background:var(--ok-soft)}
.field.mark-x input{border-color:var(--bad);background:var(--bad-soft)}
.bans{display:flex;gap:5px;flex-wrap:wrap;margin-left:auto}
.ban{font-family:var(--mono);font-size:12.5px;font-weight:600;padding:4px 10px;border-radius:8px;
  border:1.5px solid var(--bad);color:var(--bad);background:var(--bad-soft);
  text-decoration:line-through;opacity:.85}
.opts-row{display:flex;gap:7px;flex-wrap:wrap;flex:1 1 200px}
.oc{padding:9px 14px;border-radius:9px;border:1.5px solid var(--line);background:var(--surface);
  font-size:14.5px;font-weight:500;transition:.12s}
.oc:hover:not(:disabled){border-color:var(--accent)}
.oc[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.oc.mark-o{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.oc.mark-x{background:var(--bad-soft);border-color:var(--bad);color:var(--bad);text-decoration:line-through}
.oc:disabled{cursor:default}
.field select{flex:1 1 150px;min-width:0;padding:11px 13px;border-radius:9px;
  border:1.5px solid var(--line);background:var(--surface);font-size:15px}
.field select:focus{outline:none;border-color:var(--accent)}
.field.mark-o select{border-color:var(--ok);background:var(--ok-soft)}
.field.mark-x select{border-color:var(--bad);background:var(--bad-soft)}

.act{display:flex;gap:9px;padding:0 16px 16px}
.act button{flex:1;padding:13px;border-radius:10px;border:1px solid var(--line);
  background:var(--surface);font-weight:600;font-size:15px}
.act .primary{background:var(--accent);border-color:var(--accent);color:#fff;flex:2}
.act .primary:disabled{opacity:.4;cursor:not-allowed}
.verdict{margin:0;padding:14px 16px;border-top:1px solid var(--line-soft);
  display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.verdict.ok{background:var(--ok-soft)}
.verdict.bad{background:var(--bad-soft)}
.vtxt{font-weight:700;font-size:16px;letter-spacing:-.01em}
.verdict.ok .vtxt{color:var(--ok)}
.verdict.bad .vtxt{color:var(--bad)}
.vnote{font-size:13px;color:var(--muted)}
.chiprow{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-family:var(--mono);font-size:12.5px;font-weight:600;padding:3px 9px;border-radius:99px;
  border:1px solid currentColor}
.chip.o{color:var(--ok)} .chip.x{color:var(--bad)}
.vbtns{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.vbtns button{border:1px solid var(--line);background:var(--surface);border-radius:9px;
  padding:8px 13px;font-size:13.5px;font-weight:600}
.vbtns button:hover{border-color:var(--accent);color:var(--accent)}
.sol{border-top:1px solid var(--line-soft)}
.solhead{display:flex;align-items:center;gap:8px;padding:11px 16px;background:var(--surface-2);
  font-family:var(--mono);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.warn{margin:14px 16px;padding:13px 15px;border:1px dashed var(--line);border-radius:10px;
  background:var(--surface-2)}
.warn p{margin:0 0 11px;font-size:13.5px;color:var(--muted)}
.warn .row{display:flex;gap:8px;flex-wrap:wrap}
.warn button{border:1px solid var(--line);background:var(--surface);border-radius:9px;
  padding:8px 13px;font-size:13.5px;font-weight:600}
.warn .danger{border-color:var(--bad);color:var(--bad)}
.pager{display:flex;gap:9px;margin:13px 0 44px}
.pager button{flex:1;padding:12px;border-radius:10px;border:1px solid var(--line);
  background:var(--surface);font-weight:500;font-size:14px;color:var(--muted)}
.pager button:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.pager button:disabled{opacity:.35;cursor:not-allowed}
.jump{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
.jb{width:31px;height:31px;border-radius:7px;border:1px solid var(--line);background:var(--surface);
  font-family:var(--mono);font-size:11.5px;font-weight:600;display:flex;align-items:center;justify-content:center;padding:0}
.jb.done-o{border-color:var(--ok);color:var(--ok)}
.jb.done-x{border-color:var(--bad);color:var(--bad)}
.jb.cur{box-shadow:0 0 0 2px var(--accent);border-color:var(--accent)}

.score{display:flex;align-items:baseline;gap:10px;margin:6px 0 2px}
.score b{font-family:var(--mono);font-size:44px;font-weight:600;letter-spacing:-.03em}
.score span{color:var(--muted)}
.tbl{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px}
.tbl th,.tbl td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line-soft)}
.tbl th{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--faint);font-weight:500}
.tbl td.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.wrongs{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.wtag{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--bad);
  border:1px solid var(--bad);border-radius:7px;padding:4px 9px;background:transparent}
.foot{color:var(--faint);font-size:12px;padding-block:0 40px;text-align:center}
@media (max-width:480px){
  .omr{gap:7px} .bub{min-width:0;height:50px;font-size:19px} .bub.kx{font-size:15px}
  .topin{gap:8px} .qid{font-size:12.5px} .fname{min-width:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---- 필기 (굿노트식) ---- */
:root[data-pen="1"] body{padding-bottom:72px}
.inkwrap{position:relative}
.inkwrap.penon{outline:2px dashed var(--accent);outline-offset:-2px;border-radius:2px}
.ink{position:absolute;left:0;top:0;z-index:5}
:root[data-pen="1"] .ink{cursor:crosshair}
:root:not([data-pen="1"]) .ink{pointer-events:none}
.scratch{background:var(--paper);border-top:1px dashed #d9dde4}
:root[data-invert="1"] .scratch{background:#0d0f13;border-top-color:#2a2f38}
.scratchbar{display:flex;gap:8px;justify-content:center;padding:9px 16px;background:var(--surface-2);
  border-top:1px solid var(--line-soft)}
.scratchbar button{border:1px solid var(--line);background:var(--surface);border-radius:8px;
  padding:6px 12px;font-size:12.5px;font-weight:500;color:var(--muted)}
.scratchbar button:hover{border-color:var(--accent);color:var(--accent)}
.guidewrap{position:fixed;inset:0;z-index:70;background:rgba(12,16,26,.45);
  display:flex;align-items:center;justify-content:center;padding:18px}
.guide{background:var(--surface);border:1px solid var(--line);border-radius:16px;
  padding:18px 18px 16px;max-width:430px;width:100%;max-height:82vh;overflow:auto;
  box-shadow:0 24px 60px -20px rgba(10,15,30,.55)}
.guide>b{display:block;font-size:16px;margin-bottom:12px}
.grow{display:flex;gap:11px;align-items:flex-start;padding:8px 0;
  border-top:1px solid var(--line-soft)}
.grow:first-of-type{border-top:0}
.gic{flex:0 0 auto;width:32px;height:32px;border-radius:50%;border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;color:var(--ink)}
.gic svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round}
.gtx{min-width:0}
.gtx b{display:block;font-size:14px}
.gtx span{display:block;font-size:12.8px;color:var(--muted);line-height:1.5;margin-top:1px}
.guide .go{margin-top:14px}
.gbar{position:fixed;left:50%;transform:translateX(-50%);z-index:60;
  bottom:calc(14px + env(safe-area-inset-bottom,0px));
  display:flex;align-items:center;gap:7px;padding:7px 10px;border-radius:999px;
  background:var(--surface);border:1px solid var(--line);
  box-shadow:0 10px 30px -12px rgba(10,15,30,.5), 0 2px 6px rgba(10,15,30,.12);
  max-width:calc(100vw - 24px);overflow-x:auto}
.gt{flex:0 0 auto;width:36px;height:36px;border-radius:50%;border:1px solid transparent;
  background:transparent;display:flex;align-items:center;justify-content:center;padding:0;color:var(--muted)}
.gt:hover{background:var(--surface-2)}
.gt[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.gt svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round}
.gsep{flex:0 0 auto;width:1px;height:22px;background:var(--line)}
.sw2{flex:0 0 auto;width:23px;height:23px;border-radius:50%;border:2px solid transparent;padding:2px;
  background:transparent;transition:transform .12s}
.sw2 i{display:block;width:100%;height:100%;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.14)}
.sw2[aria-pressed="true"]{border-color:var(--ink);transform:scale(1.15)}
.gw{flex:0 0 auto;width:28px;height:28px;border-radius:50%;border:1px solid var(--line);
  background:var(--surface);display:flex;align-items:center;justify-content:center;padding:0;color:var(--ink)}
.gw[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}

    });
    hero.appendChild(sc);
    if (hf) hero.appendChild(el("p", "hfnote",
      "약분이 덜 된 제출 " + hf + "회 — 오답 " + (hf * 0.5) + "회로 기록했습니다."));
    w.appendChild(hero);
    var wrong = list.filter(function (rr) {
      var s2 = m[rr.p + "-" + rr.n]; return s2 && s2.tried && !s2.ok;
    });
    var undone = list.filter(function (rr) {
      var s2 = m[rr.p + "-" + rr.n]; return !s2 || !s2.tried;
    });

    var tiles = el("div", "tiles");
    [["맞힌 문항", d.ok, "ok"], ["못 맞힌 문항", wrong.length, "bad"],
     ["아직 안 푼 문항", undone.length, ""]].forEach(function (t) {
      var c = el("div", "tile " + t[2]);
      c.appendChild(el("b", null, String(t[1])));
      c.appendChild(el("span", null, t[0]));
      tiles.appendChild(c);
    });
    w.appendChild(tiles);

    w.appendChild(el("p", "sec-label", "구분별"));
    var tbl = el("table", "tbl"), hr = el("tr");
    ["구분", "푼 문항", "정답", "정답률"].forEach(function (h) { hr.appendChild(el("th", null, h)); });
    tbl.appendChild(hr);
    [1, 2, 3].forEach(function (p) {
      var tot = 0, ok = 0, has3 = false;
      list.forEach(function (rr) {
        if (rr.p !== p) return;
        has3 = true;
        var s2 = m[rr.p + "-" + rr.n];
        if (s2 && s2.tried) { tot++; if (s2.ok) ok++; }
      });
      if (!has3) return;
      var tr = el("tr");
      tr.appendChild(el("td", null, PARTS[p]));
      tr.appendChild(el("td", "num", String(tot)));
      tr.appendChild(el("td", "num", String(ok)));
      tr.appendChild(el("td", "num", tot ? Math.round(ok / tot * 100) + "%" : "–"));
      tbl.appendChild(tr);
    });
    w.appendChild(tbl);

    if (wrong.length) {
      w.appendChild(el("p", "sec-label", "못 맞힌 문항 " + wrong.length + "개"));
      var box = el("div", "wrongs");
      wrong.forEach(function (rr) {
        var b = el("button", "wtag", rr.p + "탄 " + rr.n + "번");
        b.type = "button";
        b.onclick = function () {
          st.i = list.indexOf(rr); st.openSel = null;
          st.view = "quiz"; render(); window.scrollTo(0, 0);
        };
        box.appendChild(b);
      });
      w.appendChild(box);
      var again2 = el("button", "go", "틀린 " + wrong.length + "문항만 처음부터 다시 풀기");
      again2.type = "button";
      again2.onclick = function () {
        var pick = {}, m2 = st.saved[st.set] || {};
        wrong.forEach(function (rr) {
          pick[rr.p + "-" + rr.n] = 1;
          delete m2[rr.p + "-" + rr.n];
        });
        st.scope = { mode: "pick", pick: pick, from: "wrong" };
        st.i = 0; st.openSel = null; st.view = "quiz";
        saveProg(); savePrefs(); render(); window.scrollTo(0, 0);
      };
      w.appendChild(again2);
    } else {
      w.appendChild(el("p", "sec-label", d.n ? "못 맞힌 문항 없음" : "아직 푼 문항이 없습니다"));
    }

    var again = el("button", "go ghostgo", scopeLabel() + " " + list.length + "문항 처음부터 다시 풀기");
    again.type = "button";
    again.onclick = function () {
      var m2 = st.saved[st.set] || {};
      list.forEach(function (rr) { delete m2[rr.p + "-" + rr.n]; });
      saveProg(); st.i = 0; st.openSel = null; st.view = "quiz"; render(); window.scrollTo(0, 0);
    };
    w.appendChild(again);
    var back = el("button", "ghost", "세트·범위 다시 고르기");
    back.type = "button"; back.style.width = "100%"; back.style.padding = "12px";
    back.onclick = function () { st.view = "start"; render(); window.scrollTo(0, 0); };
    w.appendChild(back);
    w.appendChild(el("p", "foot", "물통_W.B. 제작"));
    return w;
  }

  var SCRKEY = null;
  function render() {
    var y = window.pageYOffset || document.documentElement.scrollTop || 0;
    var k = st.view + "|" + st.set + "|" + st.i;
    var keep = (k === SCRKEY && y > 0);
    SCRKEY = k;
    app.textContent = "";
    if (st.view === "login") { app.appendChild(viewLogin()); return; }
    if (st.view === "pw") { app.appendChild(viewPw()); return; }
    if (!auth.user) { app.appendChild(viewLogin()); return; }
    if (st.view === "start") app.appendChild(viewStart());
    else if (st.view === "quiz") app.appendChild(viewQuiz());
    else app.appendChild(viewResult());
    if (keep) {
      window.scrollTo(0, y);
      requestAnimationFrame(function () { window.scrollTo(0, y); });
    }
  }
  // 펜을 캔버스 밖에서 떼도 획이 끝나도록 — 한 번만 등록한다 (렌더마다 쌓이면 펜이 먹통)
  window.addEventListener("pointerup", function () { if (INKEND) INKEND(); });
  window.addEventListener("pointercancel", function () { if (INKEND) INKEND(); });
  window.addEventListener("pagehide", saveInk);
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "hidden") saveInk();
  });
  document.addEventListener("selectstart", function (e) {
    var t = e.target && e.target.tagName;
    if (t !== "INPUT" && t !== "TEXTAREA") e.preventDefault();
  });
  document.addEventListener("contextmenu", function (e) {
    var t = e.target && e.target.tagName;
    if (t !== "INPUT" && t !== "TEXTAREA") e.preventDefault();
  });
  window.addEventListener("resize", function () {
    repaint();
  });
  document.addEventListener("keydown", function (e) {
    if (st.view !== "quiz") return;
    var tag = (e.target && e.target.tagName) || "";
    if (tag === "INPUT" || tag === "SELECT") return;
    var q = activeList()[st.i], r = rec(qset(q), q);
    if (e.key === "ArrowLeft") { move(-1); return; }
    if (e.key === "ArrowRight") { move(1); return; }
    if (r.ok) return;
    if (e.key === "Enter") { submit(q); return; }
    var list0 = ins(q);
    if (list0.length === 1 && list0[0].k === "mc" && /^[1-5]$/.test(e.key)) {
      var n = parseInt(e.key, 10);
      if (!banned(r, 0, String(n))) choose(q, r, 0, n);
      return;
    }
    if (list0.length === 1 && list0[0].k === "multi") {
      var opts = optsOf(q, list0[0]);
      var i2 = "123456".indexOf(e.key);
      if (i2 >= 0 && opts[i2]) {
        var g0 = r.g[0] || {}, b0 = r.b[0] || {};
        if (!g0[opts[i2]] && !b0[opts[i2]]) choose(q, r, 0, opts[i2]);
      }
    }
  });

  load(); loadInk(); setTheme(); setPen();
  auth.device = devId();
  auth.token = loadToken();
  fetch("data.json").then(function (x) { return x.json(); }).then(function (j) {
    DATA = j;
    if (!auth.token) { st.view = "login"; render(); return; }
    api("/me").then(function (r) {
      if (r.__status !== 200) { signedOut(""); return; }
      auth.user = r.user;
      if (auth.user.mustChange) { st.view = "pw"; render(); return; }
      api("/state").then(function (s2) {
        if (s2 && s2.saved) { st.saved = s2.saved || {}; st.times = s2.times || {}; saveLocal(); }
        st.view = "start"; render();
      }).catch(function () { st.view = "start"; render(); });
    }).catch(function () { st.view = "start"; render(); });
  }).catch(function () {
    app.textContent = "";
    var w = el("div", "wrap");
    w.appendChild(el("p", "sec-label", "문제 데이터를 불러오지 못했습니다. 새로고침해 주세요."));
    app.appendChild(w);
  });
})();

</script>

</body>
</html>
